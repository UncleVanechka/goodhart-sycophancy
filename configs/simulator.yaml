# goodhart.simulator — the simulated user that produces the proxy reward
# The reported results used the local judge (hf); anthropic and vllm are drop-in alternatives
backend: hf             # anthropic | vllm | hf | mock

anthropic:
  model: claude-haiku-5-5
  max_tokens: 256         # thinking is disabled at effort low..high, so this is all reply
  effort: low
  concurrency: 8
  max_retries: 3

vllm:
  base_url: ${VLLM_BASE_URL}       # OpenAI-compatible server
  model: Qwen/Qwen2.5-7B-Instruct
  max_tokens: 64
  concurrency: 16

# Judge run in-process with transformers on the local GPU: the backend to use on hosts
# where api.anthropic.com is unreachable
hf:
  model: Qwen/Qwen2.5-7B-Instruct
  device: cuda
  dtype: bfloat16
  batch_size: 16
  max_new_tokens: 8                # {"score": N} fits; nothing left for prose
  chat_template_kwargs:
    enable_thinking: false         # Qwen3 judges answer without a thinking block

# Default persona for the immediate reward. See goodhart.simulator.persona
persona: agreeable

# Scores are cached by (persona, prompt, response, gold) so re-runs never pay twice
cache: data/simulator_cache.sqlite
