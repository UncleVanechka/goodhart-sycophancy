[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goodhart-sycophancy"
version = "0.1.0"
description = "Proxy-reward optimization breeds sycophancy: Best-of-N, GRPO and RecSys-style mitigations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Everything needed to run experiments on a GPU box
gpu = [
    "torch==2.6.0",
    "transformers==5.20.2",
    "datasets==4.0.0",
    "trl==0.29.1",
    "peft==0.21.2",
    "accelerate==1.15.0",
]
# vLLM generation and the vLLM judge; not used by the reported runs
vllm = ["vllm>=0.6"]
# User simulator through the Anthropic API
anthropic = ["anthropic>=1.0"]
# Tracking and plots
tools = ["wandb>=0.18", "matplotlib>=3.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goodhart = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
